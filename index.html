<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zuicy</title>
  <link rel="stylesheet" href="assets/css/widget.css">
</head>
<body>
  <main id="widget" class="c-nowplaying is-hidden" aria-live="off">
    <div class="backdrop" aria-hidden="true">
      <img class="backdrop-image" alt="">
      <img class="backdrop-image" alt="">
    </div>
    <div class="artwork" aria-hidden="true">
      <img class="artwork-image is-active" alt="">
      <img class="artwork-image" alt="">
    </div>
    <section class="details">
      <div class="track-copy">
        <div class="line title"><span id="title" class="marquee-content"></span></div>
        <div class="line artist"><span id="artist" class="marquee-content"></span></div>
      </div>
      <div class="progress-row">
        <span id="time-current" class="time">0:00</span>
        <div class="progress"><div id="progress-fill" class="progress-fill"></div></div>
        <span id="time-total" class="time">0:00</span>
      </div>
    </section>
  </main>

  <script src="assets/js/socket.io.min.js"></script>
  <script>
    (() => {
      "use strict";

      const params = new URLSearchParams(location.search);
      const validBgModes = ["art", "artist", "accent"];
      const urlOverrides = {
        host: params.has("host") ? params.get("host") : null,
        token: params.has("token") ? params.get("token") : null,
        bg: validBgModes.includes(params.get("bg")) ? params.get("bg") : null,
        font: params.has("font") ? params.get("font") : null,
      };
      const debugFromUrl = params.get("debug") === "1";
      const canFetchLocalFiles = location.protocol !== "file:";
      let host = urlOverrides.host || "localhost:10767";
      let token = urlOverrides.token ?? "";
      let bgMode = urlOverrides.bg ?? "art";
      let baseUrl = `http://${host.replace(/^https?:\/\//, "").replace(/\/$/, "")}`;

      const widget = document.getElementById("widget");
      widget.classList.add(`bg-${bgMode}`);
      const title = document.getElementById("title");
      const artist = document.getElementById("artist");
      const trackCopy = document.querySelector(".track-copy");
      const progressFill = document.getElementById("progress-fill");
      const timeCurrentLabel = document.getElementById("time-current");
      const timeTotalLabel = document.getElementById("time-total");
      const artImages = [...document.querySelectorAll(".artwork-image")];
      const backdropImages = [...document.querySelectorAll(".backdrop-image")];
      let artistBackdropToken = 0;

      let activeArtIndex = 0;
      let artSwapToken = 0;
      let activeBackdropIndex = 0;
      let backdropSwapToken = 0;
      let backdropArtistName = null;
      const artistBackdropCache = new Map();
      let artworkThemeToken = 0;
      const artworkColorCache = new Map();
      let trackId = null;
      let playbackState = "stopped";
      let snapshotRetryCount = 0;
      let snapshotRetryTimer = null;
      let pauseTimer = null;
      let showTimer = null;
      let timeModel = { current: 0, duration: 0, isPlaying: false, receivedAt: performance.now() };
      let socket = null;
      let lastTrack = null;
      let configRaw = null;
      let configPollTimer = null;
      let artistManifestRaw = null;
      let artistImageManifest = {};
      let artistAliasManifest = {};
      let widgetInitialized = false;
      let bridgedArtistImages = false;
      let bridgedConfig = false;
      const resourceFailures = new Set();
      let debugEnabled = debugFromUrl;
      let debugOverlay = null;
      let debugConfig = "cfg: pending";
      let debugManifest = "manifest: pending";
      let debugBackdrop = "backdrop: idle";
      let debugApi = "api: pending";
      let debugSocket = "socket: disconnected";
      let debugLastWarn = "";
      const defaultFontFamily = getComputedStyle(document.body).fontFamily;

      function unwrap(value) {
        return value && typeof value === "object" ? (value.info ?? value.data ?? value) : value;
      }

      function hexColor(value) {
        const hex = typeof value === "string" ? value.replace(/^#/, "") : "";
        return /^[0-9a-f]{3}([0-9a-f]{3})?([0-9a-f]{2})?$/i.test(hex) ? `#${hex}` : null;
      }



      function reportResourceFailure(resource, error) {
        const detail = error?.message ?? String(error ?? "unavailable");
        const key = `${resource}: ${detail}`;
        if (resourceFailures.has(key)) return;
        resourceFailures.add(key);
        console.debug(`${resource} unavailable`, detail);
      }

      function clearResourceFailure(resource) {
        for (const key of resourceFailures) {
          if (key.startsWith(`${resource}:`)) resourceFailures.delete(key);
        }
      }
      function updateDebugOverlay() {
        if (!debugOverlay) return;
        const overrides = Object.entries(urlOverrides).filter(([, value]) => value !== null).map(([key]) => key).join(",") || "none";
        debugOverlay.textContent = [
          `${debugConfig} | ${debugManifest} | bridge: ${bridgedArtistImages ? "yes" : "no"} | overrides: ${overrides}`,
          debugBackdrop,
          `${debugApi} | ${debugSocket} | host: ${host}`,
          debugLastWarn ? `last warn: ${debugLastWarn}` : "last warn: none",
        ].join("\n");
      }

      function enableDebugOverlay() {
        if (!debugEnabled || debugOverlay) return;
        debugOverlay = document.createElement("pre");
        debugOverlay.style.cssText = "position:absolute;right:4px;bottom:3px;left:4px;z-index:10;margin:0;padding:3px 4px;background:rgba(0,0,0,.58);color:#fff;font:10px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;pointer-events:none";
        widget.append(debugOverlay);
        updateDebugOverlay();
      }

      function recordDebugWarning(message) {
        debugLastWarn = message;
        updateDebugOverlay();
      }
      function artworkThemeUrl(artwork) {
        return typeof artwork?.url === "string"
          ? artwork.url.replace("{w}", "80").replace("{h}", "80")
          : "";
      }

      function loadArtworkAverageColor(url) {
        if (artworkColorCache.has(url)) return artworkColorCache.get(url);
        const colorPromise = (async () => {
          const image = new Image();
          image.crossOrigin = "anonymous";
          image.src = url;
          await image.decode();

          const canvas = document.createElement("canvas");
          canvas.width = 16;
          canvas.height = 16;
          const context = canvas.getContext("2d");
          if (!context) throw new Error("Canvas context unavailable");
          context.drawImage(image, 0, 0, canvas.width, canvas.height);

          const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
          let red = 0;
          let green = 0;
          let blue = 0;
          let totalAlpha = 0;
          for (let index = 0; index < pixels.length; index += 4) {
            const alpha = pixels[index + 3] / 255;
            red += pixels[index] * alpha;
            green += pixels[index + 1] * alpha;
            blue += pixels[index + 2] * alpha;
            totalAlpha += alpha;
          }
          if (!totalAlpha) throw new Error("Artwork has no visible pixels");
          return [red, green, blue].map(value => Math.round((value / totalAlpha) * 0.75));
        })();
        artworkColorCache.set(url, colorPromise);
        colorPromise.catch(() => artworkColorCache.delete(url));
        return colorPromise;
      }

      async function applyArtworkTheme(artwork, token) {
        const url = artworkThemeUrl(artwork);
        if (!url) return;
        try {
          const [red, green, blue] = await loadArtworkAverageColor(url);
          if (token !== artworkThemeToken) return;
          const rootStyle = document.documentElement.style;
          rootStyle.setProperty("--background", `rgb(${red}, ${green}, ${blue})`);
          rootStyle.setProperty("--primary", "#ffffff");
          rootStyle.setProperty("--secondary", "rgba(255, 255, 255, 0.78)");
          rootStyle.setProperty("--progress-track", "rgba(255, 255, 255, 0.24)");
        } catch (error) {
          console.debug("Artwork theme extraction unavailable", error);
        }
      }

      function setTheme(artwork) {
        const token = ++artworkThemeToken;
        const background = hexColor(artwork?.bgColor);
        const primary = hexColor(artwork?.textColor1);
        const secondary = hexColor(artwork?.textColor2);
        const rootStyle = document.documentElement.style;
        const setOrReset = (property, value) => value ? rootStyle.setProperty(property, value) : rootStyle.removeProperty(property);

        setOrReset("--background", background);
        setOrReset("--primary", primary);
        setOrReset("--secondary", secondary);
        setOrReset("--progress-track", secondary && `${secondary}66`);
        if (!background && !primary && !secondary) applyArtworkTheme(artwork, token);
      }

      function formatTime(seconds) {
        const total = Math.max(0, Math.floor(Number(seconds) || 0));
        return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
      }

      function updateMarquee(line) {
        const content = line.firstElementChild;
        line.classList.remove("is-overflowing");
        const overflow = content.scrollWidth - line.clientWidth
          + (parseFloat(getComputedStyle(line).paddingLeft) || 0);
        const overflowing = overflow > 1;
        line.classList.toggle("is-overflowing", overflowing);
        content.style.setProperty("--marquee-distance", `${-Math.max(0, overflow)}px`);
        content.style.setProperty("--marquee-duration", `${Math.max(8, Math.max(0, overflow) / 25)}s`);
      }

      function updateMarquees() {
        updateMarquee(title.parentElement);
        updateMarquee(artist.parentElement);
      }

      function show() {
        clearTimeout(pauseTimer);
        pauseTimer = null;
        if (!widget.classList.contains("is-hidden")) return;
        if (showTimer !== null) return;
        showTimer = setTimeout(() => {
          showTimer = null;
          widget.classList.remove("is-hidden");
        }, 350);
      }

      function hideSoon() {
        clearTimeout(showTimer);
        showTimer = null;
        clearTimeout(pauseTimer);
        pauseTimer = setTimeout(() => widget.classList.add("is-hidden"), 2000);
      }

      function hideNow() {
        clearTimeout(showTimer);
        showTimer = null;
        clearTimeout(pauseTimer);
        pauseTimer = null;
        widget.classList.add("is-hidden");
      }

      function setPlaybackState(state) {
        if (state !== "playing" && state !== "paused" && state !== "stopped") return;
        const changed = playbackState !== state;
        playbackState = state;
        timeModel.isPlaying = state === "playing";
        if (state === "playing") show();
        else if (changed) hideSoon();
      }

      function animateCopy() {
        trackCopy.classList.remove("is-changing");
        void trackCopy.offsetWidth;
        trackCopy.classList.add("is-changing");
      }

      function artworkUrl(artwork) {
        return typeof artwork?.url === "string"
          ? artwork.url.replace("{w}", "400").replace("{h}", "400")
          : "";
      }

      function backdropArtworkUrl(artwork) {
        return typeof artwork?.url === "string"
          ? artwork.url.replace("{w}", "800").replace("{h}", "800")
          : "";
      }

      async function setArtwork(artwork, animate) {
        const url = artworkUrl(artwork);
        if (!url) return;
        const token = ++artSwapToken;
        const nextIndex = animate ? 1 - activeArtIndex : activeArtIndex;
        const nextImage = artImages[nextIndex];

        if (nextImage.src !== url) {
          nextImage.src = url;
          await Promise.race([
            nextImage.decode().catch(() => {}),
            new Promise(resolve => setTimeout(resolve, 1000)),
          ]);
          if (token !== artSwapToken) return;
        }

        if (animate) {
          artImages[activeArtIndex].classList.remove("is-active");
          nextImage.classList.add("is-active");
          activeArtIndex = nextIndex;
        } else {
          nextImage.classList.add("is-active");
        }
      }

      function deezerSearchArtist(name) {
        return new Promise(resolve => {
          const cb = `__dzcb${Math.floor(performance.now() * 1000)}`;
          const script = document.createElement("script");
          const timer = setTimeout(() => finish(null), 4000);
          function finish(result) {
            clearTimeout(timer);
            delete window[cb];
            script.remove();
            resolve(result);
          }
          window[cb] = data => finish(data?.data?.[0] ?? null);
          script.onerror = () => finish(null);
          script.src = `https://api.deezer.com/search/artist?q=${encodeURIComponent(name)}&limit=1&output=jsonp&callback=${cb}`;
          document.head.append(script);
        });
      }

      function normalizeName(s) {
        return s.toLowerCase()
          .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
          .replace(/[^\p{L}\p{N}]+/gu, " ")
          .trim();
      }

      function artistMatches(result, query) {
        return Boolean(result?.name) && normalizeName(result.name) === normalizeName(query);
      }

      async function findArtistBackdrop(name) {
        let query = name;
        let result = await deezerSearchArtist(query);
        if (!artistMatches(result, query)) {
          const fallback = name.split(/,|&|\s+feat\./i)[0].trim();
          if (!fallback || fallback === name) return null;
          query = fallback;
          result = await deezerSearchArtist(query);
        }
        return artistMatches(result, query) ? (result.picture_xl ?? result.picture_big ?? null) : null;
      }

      function clearBackdrop() {
        backdropImages.forEach(image => image.classList.remove("is-active"));
        widget.classList.remove("has-backdrop");
      }

      async function setBackdropImage(url, resolution = "") {
        const token = ++backdropSwapToken;
        if (!url) {
          clearBackdrop();
          return false;
        }

        const activeImage = backdropImages[activeBackdropIndex];
        if (activeImage.classList.contains("is-active") && activeImage.src === url) {
          widget.classList.add("has-backdrop");
          return true;
        }

        const preload = new Image();
        preload.src = url;
        let failed = false;
        await Promise.race([
          preload.decode().then(() => {}, () => { failed = true; }),
          new Promise(resolve => setTimeout(resolve, 1500)),
        ]);
        if (!failed && preload.naturalWidth === 0 && preload.complete) failed = true;
        if (failed) {
          debugBackdrop = `backdrop: ${url}${resolution ? ` (${resolution})` : ""} → FAILED`;
          const warning = `Backdrop image failed to load ${url}`;
          console.warn("Backdrop image failed to load", url);
          recordDebugWarning(warning);
          if (token === backdropSwapToken) clearBackdrop();
          return false;
        }
        if (token !== backdropSwapToken) {
          console.debug("Backdrop image preload superseded", url);
          return false;
        }

        const nextIndex = 1 - activeBackdropIndex;
        const nextImage = backdropImages[nextIndex];
        if (nextImage.src !== url) nextImage.src = url;
        backdropImages[activeBackdropIndex].classList.remove("is-active");
        nextImage.classList.add("is-active");
        activeBackdropIndex = nextIndex;
        widget.classList.add("has-backdrop");
        debugBackdrop = `backdrop: ${url}${resolution ? ` (${resolution})` : ""} → OK`;
        updateDebugOverlay();
        return true;
      }

      async function setArtistBackdrop(name) {
        const token = ++artistBackdropToken;
        const key = normalizeName(name);
        if (!key) {
          clearBackdrop();
          return;
        }

        const directSource = artistImageManifest[key];
        if (directSource) {
          const directUrl = /^[a-z][a-z0-9+.-]*:/i.test(directSource)
            ? directSource
            : `artist-images/${encodeURIComponent(directSource)}`;
          const applied = await setBackdropImage(directUrl);
          if (token !== artistBackdropToken) {
            console.debug("Artist backdrop direct preload superseded", name);
            return;
          }
          if (applied) return;
        }

        const primaryKey = artistAliasManifest[key];
        const aliasSource = primaryKey && artistImageManifest[primaryKey];
        if (aliasSource) {
          const aliasUrl = /^[a-z][a-z0-9+.-]*:/i.test(aliasSource)
            ? aliasSource
            : `artist-images/${encodeURIComponent(aliasSource)}`;
          const applied = await setBackdropImage(aliasUrl, "alias");
          if (token !== artistBackdropToken) {
            console.debug("Artist backdrop alias preload superseded", name);
            return;
          }
          if (applied) return;
        }

        const conventionFile = `${key.replace(/\s+/g, "-")}.jpg`;
        if (conventionFile !== directSource) {
          const applied = await setBackdropImage(`artist-images/${encodeURIComponent(conventionFile)}`);
          if (token !== artistBackdropToken) {
            console.debug("Artist backdrop convention preload superseded", name);
            return;
          }
          if (applied) return;
        }

        if (!artistBackdropCache.has(key)) {
          artistBackdropCache.set(key, findArtistBackdrop(name));
        }
        const pictureUrl = await artistBackdropCache.get(key);
        if (token !== artistBackdropToken) {
          console.debug("Artist backdrop search superseded before image preload", name);
          return;
        }
        if (!pictureUrl) {
          clearBackdrop();
          return;
        }
        const applied = await setBackdropImage(pictureUrl);
        if (applied) {
          debugBackdrop = `backdrop: ${pictureUrl} → OK (fallback: deezer OK)`;
          updateDebugOverlay();
        }
      }

      function setTrack(rawTrack) {
        const track = rawTrack?.attributes ?? unwrap(rawTrack);
        if (!track || typeof track !== "object") return;

        const id = track.id ?? track.playParams?.id ?? null;
        const changed = trackId !== null && id !== null && id !== trackId;
        if (id !== null) trackId = id;

        if (changed) {
          timeModel.current = 0;
          timeModel.receivedAt = performance.now();
        }

        const artistName = track.artistName ?? "";
        lastTrack = track;
        title.textContent = track.name ?? "";
        artist.textContent = artistName;
        updateBackdropForTrack(track);
        setTheme(track.artwork);
        const isConcealed = widget.classList.contains("is-hidden") || showTimer !== null;
        setArtwork(track.artwork, changed && !isConcealed);
        if (Number.isFinite(Number(track.durationInMillis))) {
          timeModel.duration = Number(track.durationInMillis) / 1000;
        }
        if (changed && !isConcealed) animateCopy();
        requestAnimationFrame(updateMarquees);
      }

      function updateBackdropForTrack(track) {
        if (bgMode === "art") {
          setBackdropImage(backdropArtworkUrl(track.artwork));
          return;
        }
        if (bgMode === "artist") {
          const artistName = track.artistName ?? "";
          if (artistName !== backdropArtistName) {
            backdropArtistName = artistName;
            setArtistBackdrop(artistName);
          }
        }
      }

      function applyBackgroundMode(mode) {
        const nextMode = validBgModes.includes(mode) ? mode : "art";
        if (nextMode === bgMode) return;
        widget.classList.remove(`bg-${bgMode}`);
        bgMode = nextMode;
        widget.classList.add(`bg-${bgMode}`);
        artistBackdropToken += 1;
        backdropSwapToken += 1;
        backdropArtistName = null;
        clearBackdrop();
        if (lastTrack) updateBackdropForTrack(lastTrack);
      }

      function applyConfiguredFont(font) {
        const sanitized = typeof font === "string"
          ? font.replace(/[^\p{L}\p{N} \-]/gu, "").trim()
          : "";
        document.body.style.fontFamily = sanitized
          ? `"${sanitized}", ${defaultFontFamily}`
          : "";
        updateMarquees();
        document.fonts.ready.then(updateMarquees);
      }

      function applyWidgetConfig(config, source = "none") {
        const configuredHost = typeof config?.host === "string" ? config.host.trim() : "";
        const configuredToken = typeof config?.token === "string" ? config.token : "";
        const configuredBg = validBgModes.includes(config?.bg) ? config.bg : "art";
        const configuredFont = typeof config?.font === "string" ? config.font : "";
        const nextHost = urlOverrides.host || configuredHost || "localhost:10767";
        const nextToken = urlOverrides.token ?? configuredToken;
        const nextBg = urlOverrides.bg ?? configuredBg;
        const nextFont = urlOverrides.font ?? configuredFont;
        const connectionChanged = nextHost !== host || nextToken !== token;

        if (config?.debug === true) {
          debugEnabled = true;
          enableDebugOverlay();
        }
        debugConfig = `cfg: loaded(${source}, bg=${nextBg})`;
        updateDebugOverlay();
        applyBackgroundMode(nextBg);
        applyConfiguredFont(nextFont);
        if (!connectionChanged) return;
        host = nextHost;
        token = nextToken;
        baseUrl = `http://${host.replace(/^https?:\/\//, "").replace(/\/$/, "")}`;
        if (widgetInitialized) {
          reconnectSocket();
          loadSnapshot();
        }
      }

      function parseArtistImageManifest(manifest) {
        if (!manifest || typeof manifest !== "object" || Array.isArray(manifest)) {
          return { images: {}, aliases: {} };
        }
        const images = manifest.images && typeof manifest.images === "object" && !Array.isArray(manifest.images)
          ? manifest.images
          : manifest;
        const aliases = manifest.images && typeof manifest.aliases === "object" && !Array.isArray(manifest.aliases)
          ? manifest.aliases
          : {};
        return {
          images: Object.fromEntries(
            Object.entries(images).filter(([key, value]) => typeof key === "string" && typeof value === "string"),
          ),
          aliases: Object.fromEntries(
            Object.entries(aliases).filter(([key, value]) => typeof key === "string" && typeof value === "string"),
          ),
        };
      }

      function applyArtistImageManifest(manifest, source = "bridge") {
        const parsed = parseArtistImageManifest(manifest);
        artistImageManifest = parsed.images;
        artistAliasManifest = parsed.aliases;
        bridgedArtistImages = source === "bridge";
        debugManifest = `manifest: ${Object.keys(artistImageManifest).length} entries (${source})`;
        if (bgMode === "artist" && lastTrack) {
          artistBackdropToken += 1;
          backdropSwapToken += 1;
          backdropArtistName = null;
          updateBackdropForTrack(lastTrack);
        }
      }

      function loadScriptConfig(src, globalKey) {
        return new Promise(resolve => {
          delete window[globalKey];
          const script = document.createElement("script");
          script.src = `${src}?t=${Date.now()}`;
          script.onload = () => {
            const value = window[globalKey] ?? null;
            script.remove();
            resolve(value);
          };
          script.onerror = () => {
            script.remove();
            resolve(null);
          };
          document.head.append(script);
        });
      }

      async function loadArtistManifest() {
        if (bridgedArtistImages) return;
        if (!canFetchLocalFiles && bgMode !== "artist") {
          debugManifest = "manifest: 0 entries (none)";
          updateDebugOverlay();
          return;
        }
        const scriptManifest = await loadScriptConfig("artist-images/index.js", "__zuicyArtistImages");
        if (scriptManifest) {
          applyArtistImageManifest(scriptManifest, "script");
          clearResourceFailure("artist-images/index.json");
          return;
        }
        if (!canFetchLocalFiles) {
          debugManifest = "manifest: 0 entries (none)";
          updateDebugOverlay();
          if (artistManifestRaw !== "") {
            artistManifestRaw = "";
            artistImageManifest = {};
            artistAliasManifest = {};
          }
          return;
        }
        try {
          const response = await fetch("artist-images/index.json", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const raw = await response.text();
          if (raw === artistManifestRaw) return;
          artistManifestRaw = raw;
          applyArtistImageManifest(JSON.parse(raw), "json");
          clearResourceFailure("artist-images/index.json");
        } catch (error) {
          reportResourceFailure("artist-images/index.json", error);
          debugManifest = "manifest: 0 entries (none)";
          updateDebugOverlay();
          if (artistManifestRaw !== "") {
            artistManifestRaw = "";
            artistImageManifest = {};
            artistAliasManifest = {};
          }
        }
      }

      async function refreshWidgetResources() {
        const scriptConfig = await loadScriptConfig("widget-config.js", "__zuicyConfig");
        if (scriptConfig) {
          configRaw = null;
          applyWidgetConfig(scriptConfig, "script");
          clearResourceFailure("widget-config.json");
        } else if (canFetchLocalFiles) {
          try {
            const response = await fetch("widget-config.json", { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const raw = await response.text();
            if (raw !== configRaw) {
              configRaw = raw;
              applyWidgetConfig(JSON.parse(raw), "json");
              clearResourceFailure("widget-config.json");
            }
          } catch (error) {
            reportResourceFailure("widget-config.json", error);
            applyWidgetConfig({}, "none");
          }
        } else {
          applyWidgetConfig({}, "none");
        }
        await loadArtistManifest();
      }

      async function pollWidgetConfig() {
        await refreshWidgetResources();
        const interval = bridgedConfig || bridgedArtistImages ? 30000 : 3000;
        configPollTimer = setTimeout(pollWidgetConfig, interval);
      }

      window.addEventListener("message", event => {
        const message = event.data;
        if (!message || typeof message !== "object") return;
        if (message.type === "zuicy:config" && message.config && typeof message.config === "object") {
          bridgedConfig = true;
          applyWidgetConfig(message.config, "bridge");
        } else if (message.type === "zuicy:artist-images") {
          applyArtistImageManifest(message.manifest);
        }
      });

      function setTime(data) {
        if (!data || typeof data !== "object") return;
        const current = Number(data.currentPlaybackTime ?? data.currentTime);
        const duration = Number(data.currentPlaybackDuration ?? data.duration);
        if (Number.isFinite(current)) timeModel.current = current;
        if (Number.isFinite(duration)) timeModel.duration = duration;
        if (typeof data.isPlaying === "boolean") {
          setPlaybackState(data.isPlaying ? "playing" : "paused");
        }
        timeModel.receivedAt = performance.now();
      }

      function renderTime(now) {
        const duration = Math.max(0, timeModel.duration || 0);
        const elapsed = timeModel.isPlaying ? (now - timeModel.receivedAt) / 1000 : 0;
        const current = Math.min(duration, Math.max(0, timeModel.current + elapsed));
        progressFill.style.width = `${duration ? (current / duration) * 100 : 0}%`;
        timeCurrentLabel.textContent = formatTime(current);
        timeTotalLabel.textContent = formatTime(duration);
        requestAnimationFrame(renderTime);
      }

      function fetchOptions() {
        return token ? { headers: { apptoken: token } } : {};
      }

      function snapshotSummary(value) {
        try {
          return (typeof value === "string" ? value : JSON.stringify(value)).slice(0, 300);
        } catch {
          return String(value).slice(0, 300);
        }
      }

      async function getJson(path) {
        const response = await fetch(`${baseUrl}${path}`, fetchOptions());
        const text = response.status === 204 ? "" : await response.text();
        if (!response.ok) {
          const error = new Error(`${path}: ${response.status}`);
          error.summary = text.slice(0, 300);
          throw error;
        }
        if (response.status === 204) return null;
        try {
          return JSON.parse(text);
        } catch (error) {
          error.summary = text.slice(0, 300);
          throw error;
        }
      }

      function scheduleSnapshotRetry() {
        if (title.textContent || snapshotRetryCount >= 3 || snapshotRetryTimer) return;
        snapshotRetryCount += 1;
        snapshotRetryTimer = setTimeout(() => {
          snapshotRetryTimer = null;
          loadSnapshot();
        }, 3000);
      }

      async function loadSnapshot() {
        let v2Available = false;
        try {
          const rawPayload = await getJson("/api/v2/playback");
          const payload = unwrap(rawPayload);
          if (!payload || typeof payload !== "object") {
            const error = new Error("Invalid v2 payload");
            error.summary = snapshotSummary(rawPayload);
            throw error;
          }
          v2Available = true;
          debugApi = "api: v2";
          updateDebugOverlay();
          setTrack(payload.nowPlaying);
          setTime(payload.time);
          setPlaybackState(payload.state ?? (payload.time?.isPlaying ? "playing" : "paused"));
        } catch (error) {
          console.warn("Cider v2 snapshot unavailable", error.summary ?? error.message);
        }

        if (!v2Available) {
          try {
            const [nowPlaying, isPlaying] = await Promise.all([
              getJson("/api/v1/playback/now-playing"),
              getJson("/api/v1/playback/is-playing")
            ]);
            debugApi = "api: v1";
            updateDebugOverlay();
            const info = unwrap(nowPlaying);
            setTrack(info);
            if (Number.isFinite(Number(info?.currentPlaybackTime))) {
              setTime({
                currentPlaybackTime: info.currentPlaybackTime,
                currentPlaybackDuration: (info.durationInMillis ?? 0) / 1000,
              });
            }
            const playing = unwrap(isPlaying);
            const isActive = typeof playing === "boolean"
              ? playing
              : Boolean(playing?.isPlaying ?? playing?.is_playing ?? playing?.playing);
            setPlaybackState(isActive ? "playing" : "paused");
          } catch (error) {
            console.warn("Cider v1 snapshot unavailable", error.summary ?? error.message);
          }
        }

        scheduleSnapshotRetry();
      }

      function handlePlaybackEvent(message) {
        if (!message || typeof message !== "object") return;
        switch (message.type) {
          case "playbackStatus.nowPlayingItemDidChange":
            setTrack(message.data);
            break;
          case "playbackStatus.playbackTimeDidChange":
            setTime(message.data);
            break;
          case "playbackStatus.playbackStateDidChange":
            setPlaybackState(message.data?.state);
            break;
        }
      }

      function reconnectSocket() {
        if (socket) socket.disconnect();
        socket = io(baseUrl, {
          transports: ["websocket", "polling"],
          reconnectionDelay: 1000
        });
        socket.on("API:Playback", handlePlaybackEvent);
        socket.on("connect", () => {
          debugSocket = "socket: connected";
          updateDebugOverlay();
          if (playbackState === "playing") show();
          loadSnapshot();
        });
        socket.on("disconnect", () => {
          debugSocket = "socket: disconnected";
          updateDebugOverlay();
          hideNow();
        });
        socket.on("connect_error", (error) => console.debug("Cider socket unavailable", error));
      }

      async function initializeWidget() {
        await refreshWidgetResources();
        widgetInitialized = true;
        reconnectSocket();
        loadSnapshot();
        configPollTimer = setTimeout(pollWidgetConfig, 3000);
      }

      enableDebugOverlay();
      window.addEventListener("resize", updateMarquees);
      document.fonts.ready.then(updateMarquees);
      requestAnimationFrame(renderTime);
      initializeWidget();
    })();
  </script>
</body>
</html>
